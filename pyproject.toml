[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brixbot-app"
version = "0.1.0"
description = "BrixBot PC app - configure, load and drive a BrixBot hub"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brixbot = "brixbot_app.__main__:main"

[tool.setuptools.packages.find]
include = ["brixbot_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
